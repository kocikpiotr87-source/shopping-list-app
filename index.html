<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Shopping List — Mobile + Realtime + PWA</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card:hover { box-shadow: 0 10px 30px rgb(0 0 0 / 0.08); transform: translateY(-1px); }
    .tap-row { min-height: 48px; touch-action: pan-y; }
    input[type="checkbox"] { width: 20px; height: 20px; }
    .swipe-wrap { position: relative; overflow: hidden; }
    .swipe-bg   { position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; padding-right:12px; background:#fee2e2; color:#b91c1c; font-weight:600; }
    .swipe-fore { position:relative; background:white; will-change: transform; transition: transform .15s ease-out; }
    @media (max-width: 767px) {
      .mobile-sticky { position: sticky; bottom: 0; }
      .mobile-sticky > * { flex: 1 1 0; }
    }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff; }
      .card { break-inside: avoid; box-shadow:none !important; border:1px solid #e5e7eb; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <!-- Top -->
  <header class="sticky top-0 z-10 bg-slate-50/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-3 space-y-2">
      <div class="flex items-center justify-between">
        <h1 class="text-xl sm:text-2xl font-semibold">🛒 Shopping List</h1>
        <span id="statusDot" class="text-xs rounded-full px-2 py-1 bg-slate-200">offline</span>
      </div>

      <!-- Quick Add -->
      <div class="no-print grid grid-cols-1 sm:grid-cols-[1fr_auto_auto] gap-2">
        <input id="addInput" type="text" placeholder="Add an item…"
               class="w-full px-3 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"/>
        <select id="addCat" class="px-3 py-3 rounded-lg border border-slate-300 bg-white"></select>
        <button id="addBtn" class="px-4 py-3 rounded-lg bg-blue-600 text-white">Add</button>
      </div>

      <!-- Search + controls -->
      <div class="flex flex-col sm:flex-row gap-2 no-print">
        <input id="search" type="search" placeholder="Search items…"
               class="w-full sm:w-80 px-3 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"/>
        <div class="flex gap-2">
          <label class="flex items-center gap-2 px-3 py-3 rounded-lg border border-slate-300 bg-white cursor-pointer w-full sm:w-auto">
            <input id="hideChecked" type="checkbox" class="shrink-0"><span class="text-sm">Hide checked</span>
          </label>
          <button id="btnAisle" class="px-4 py-3 rounded-lg bg-purple-600 text-white w-full sm:w-auto">Aisle order</button>
          <button id="resetBtn" class="px-4 py-3 rounded-lg bg-amber-500 text-white w-full sm:w-auto">Reset</button>
          <button id="shareRealtime" class="px-4 py-3 rounded-lg bg-teal-600 text-white w-full sm:w-auto">Share Live Link</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-4 pb-24">
    <div id="listRoot" class="grid gap-3 sm:gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Bottom actions -->
  <div class="no-print bg-white/95 backdrop-blur border-t border-slate-200 mobile-sticky fixed md:static left-0 right-0 md:max-w-6xl bottom-0">
    <div class="px-3 sm:px-4 py-2 md:py-0 flex gap-2 md:justify-end">
      <button id="selectAll" class="px-4 py-3 rounded-lg bg-blue-600 text-white">Select all</button>
      <button id="clearChecked" class="px-4 py-3 rounded-lg bg-slate-200 hover:bg-slate-300">Clear</button>
      <button id="printBtn" class="px-4 py-3 rounded-lg bg-slate-200 hover:bg-slate-300 hidden md:inline-flex">Print</button>
      <button id="shareBtn" class="px-4 py-3 rounded-lg bg-slate-200 hover:bg-slate-300 hidden md:inline-flex">Share</button>
    </div>
  </div>

  <!-- Templates -->
  <template id="cardTpl">
    <section class="card bg-white border border-slate-200 rounded-xl transition shadow-sm">
      <div class="px-4 pt-3 flex items-center justify-between gap-2">
        <h2 class="font-medium text-base sm:text-lg title"></h2>
        <div class="flex items-center gap-2 no-print">
          <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-700 count">0/0</span>
          <select class="sortSel px-2 py-2 rounded-lg border border-slate-300 bg-white text-sm">
            <option value="original">Original</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
          <label class="inline-flex items-center gap-1 px-2 py-2 rounded-lg border border-slate-300 bg-white text-sm cursor-pointer">
            <input type="checkbox" class="chkLast size-4"> Last
          </label>
          <button class="toggle px-3 py-2 rounded-lg border border-slate-300 bg-slate-100 text-sm">Collapse</button>
        </div>
      </div>
      <hr class="border-slate-200 mt-2">
      <div class="px-2 sm:px-4 py-2 grid gap-2 content"></div>
    </section>
  </template>

  <template id="rowTpl">
    <div class="swipe-wrap rounded-lg">
      <div class="swipe-bg">Delete</div>
      <div class="swipe-fore">
        <label class="tap-row group flex items-center gap-3 px-2 py-2 rounded-lg border border-transparent hover:border-slate-200 cursor-pointer bg-white">
          <input type="checkbox" class="mt-0.5">
          <span class="flex-1 item-name"></span>
          <button type="button" title="Delete" class="no-print opacity-70 hover:opacity-100 transition text-red-600 hover:text-red-700 px-2">🗑️</button>
        </label>
      </div>
    </div>
  </template>

  <!-- Toast -->
  <div id="toast" class="no-print fixed bottom-16 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="bg-slate-900 text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-3">
      <span id="toastMsg">Deleted</span>
      <button id="undoBtn" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full">Undo</button>
    </div>
  </div>

  <!-- Firebase (realtime sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

  <script>
    // ---- YOUR FIREBASE CONFIG (replace with your values) ----
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDASaHdDXfIQNxjC1GMoC5GutfUezP-O2o",
  authDomain: "xxxx-138f2.firebaseapp.com",
  projectId: "xxxx-138f2",
  storageBucket: "xxxx-138f2.firebasestorage.app",
  messagingSenderId: "207992388283",
  appId: "1:207992388283:web:53648b7a89c46a86d6c79e",
  measurementId: "G-T9TBLF0L95"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Anonymous auth for simplicity
    auth.signInAnonymously().catch(console.error);

    // ---- Base data ----
    const INITIAL_DATA = {
      "FARMERS MARKET": [
        "any other fruit or veg you see that looks good and is reasonable",
        "only if still looks good Lettuce - 1 large head or 2 small",
        "Apples","Pears","only if still looks good tomatoes- nice mix",
        "corn","zucchini","Cucumber"
      ],
      "Produce": [
        "Bananas","Potatoes yellow or yukon","Lemons (lots)","Apples","Cauliflower",
        "Cherries or pineapple","strawberries","Garlic","Onions","Watermelon",
        "Baby 🥕","Carrots","Grapes","Sweet potatoes"
      ],
      "🧀 Dairy & Eggs": [
        "Soft tortillas","Cream cheese","Mexican cheese","Yogurt flavored","Milk","Parm",
        "Yogurt Greek","Halloumi","Eggs","Queso","Mozz","Cheese sticks","Feta"
      ],
      "🥩 Meat & Alternatives": [
        "Hummus","Chicken nuggets","Tofu (2)","Pepperoni","Meat sticks",
        "Ham for lunchables","Hot dogs"
      ],
      "❄️ Frozen": [
        "Chicken tenders or nuggets","Frozen broccoli","Italian ices lemon","Ice cream",
        "Ice cream cookie dough","Shrimp","mini pancakes","Sweet potato fries",
        "Frozen blueberries","Frozen strawberries","Frozen pizza","Veggie burgers","Edamame"
      ],
      "🥫 Pantry & Dry Goods": [
        "Kosher salt","Coffee","2 Cans cannellini beans","2 cans black beans",
        "Light brown sugar","Spaghetti sauce","Dark brown sugar","Table salt",
        "Mayo","Salsa","Ketchup"
      ],
      "🍝 Grains & Pasta": ["Pizza dough","White rice","Pasta, long, short","Brown rice"],
      "🥣 Cereal": ["Honey Nut Cheerios","Oatmeal","Granola muslei","Cheerios"],
      "🧃 Beverages": ["Lime juice","Seltzer","Apple cider/juice","Lemon juice","2 - 2 liter bottles"],
      "🍬 Snacks & Treats": [
        "Snacks","SunChips","Ice cream","Italian ices (lemon)","Lunch snacks","Popsicles",
        "crackers to make lunchables","Pistachios","Party and chocolate muffins","Walnuts",
        "Marshmallows","Pretzels"
      ],
      "🍞 Bakery": ["Challah","Bread","Pizza dough","Buns","Kids bread","Hot dog buns","Plain bagels for Louisa lunch"]
    };
    const AISLE_ORDER = [
      "FARMERS MARKET","Produce","🧀 Dairy & Eggs","🥩 Meat & Alternatives",
      "❄️ Frozen","🥫 Pantry & Dry Goods","🍝 Grains & Pasta",
      "🥣 Cereal","🧃 Beverages","🍬 Snacks & Treats","🍞 Bakery"
    ];

    // ---- Local fallback (used for offline + initial render) ----
    const STORAGE_VER = "v9";
    const STORAGE_KEY = "shopping-list-" + STORAGE_VER;
    function seedLocal() {
      const s = { _meta: { order: Object.keys(INITIAL_DATA) } };
      for (const [cat, arr] of Object.entries(INITIAL_DATA)) {
        s[cat] = {
          sort: "original",
          checkedLast: false,
          items: arr.map((name, i) => ({ id:`${cat}-${i}`, idx:i, name, checked:false }))
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return s;
    }
    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seedLocal(); }
      catch { return seedLocal(); }
    }
    function saveLocal(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    // ---- Realtime doc (listId via URL) ----
    const params = new URLSearchParams(location.search);
    let listId = params.get("listId") || null;
    if (!listId) { // generate and redirect with id to make sharing easy
      listId = Math.random().toString(36).slice(2, 10);
      params.set("listId", listId);
      history.replaceState(null, "", `?${params.toString()}${location.hash}`);
    }
    const docRef = db.collection("shoppingLists").doc(listId);

    // presence indicator
    const statusDot = document.getElementById("statusDot");
    function setOnline(v){ statusDot.textContent = v ? "online" : "offline"; statusDot.className = `text-xs rounded-full px-2 py-1 ${v?'bg-emerald-200':'bg-slate-200'}` }

    // initial local state
    let STATE = loadLocal();
    let lastDeleted = null;
    let suppressNextLocalSave = false;

    // create doc if missing
    async function ensureDoc() {
      const snap = await docRef.get();
      if (!snap.exists) {
        await docRef.set({ state: STATE, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
    }

    // listen for changes
    auth.onAuthStateChanged(async () => {
      try {
        await ensureDoc();
        setOnline(true);
        docRef.onSnapshot(snap => {
          if (!snap.exists) return;
          const cloud = snap.data().state;
          // Merge strategy: cloud wins; overwrite local then render
          suppressNextLocalSave = true;
          STATE = cloud;
          saveLocal(STATE);
          render();
        }, () => setOnline(false));
      } catch {
        setOnline(false);
      }
    });

    // batched save to cloud
    let saveTimer = null;
    function saveBoth() {
      saveLocal(STATE);
      if (suppressNextLocalSave) { suppressNextLocalSave = false; return; }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await docRef.set({ state: STATE, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          setOnline(true);
        } catch { setOnline(false); }
      }, 200);
    }

    // ---------- UI logic (same as your mobile build, shortened where possible) ----------
    function allCategories(){ return Object.keys(STATE).filter(k => k !== "_meta"); }
    function sortItems(catObj){
      const { sort, checkedLast } = catObj;
      return [...catObj.items].sort((a,b) => {
        if (checkedLast && a.checked !== b.checked) return a.checked ? 1 : -1;
        if (sort === "az") return a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
        if (sort === "za") return b.name.localeCompare(a.name, undefined, {sensitivity:'base'});
        return a.idx - b.idx;
      });
    }

    const grid  = document.getElementById("listRoot");
    const cardTpl = document.getElementById("cardTpl");
    const rowTpl  = document.getElementById("rowTpl");
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const undoBtn = document.getElementById('undoBtn');
    let toastTimer;
    function showToast(msg, onUndo){
      toastMsg.textContent = msg; toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      undoBtn.onclick = () => { toast.classList.add('hidden'); onUndo?.(); };
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function render(){
      const q = document.getElementById("search").value.trim().toLowerCase();
      const hideChecked = document.getElementById("hideChecked").checked;

      // fill Add select
      const addSel = document.getElementById('addCat');
      addSel.innerHTML = '';
      allCategories().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat; opt.textContent = cat;
        addSel.appendChild(opt);
      });

      grid.innerHTML = "";
      const order = STATE._meta?.order ?? allCategories();

      order.forEach(cat => {
        const catObj = STATE[cat]; if (!catObj) return;
        const card = cardTpl.content.firstElementChild.cloneNode(true);
        card.querySelector(".title").textContent = cat;
        const content = card.querySelector(".content");
        const cnt = card.querySelector(".count");
        const sortSel = card.querySelector(".sortSel");
        const chkLast = card.querySelector(".chkLast");
        const toggle  = card.querySelector(".toggle");

        // mobile default collapsed
        if (window.matchMedia("(max-width: 767px)").matches) { content.classList.add("hidden"); toggle.textContent = "Expand"; }

        sortSel.value = catObj.sort || "original";
        chkLast.checked = !!catObj.checkedLast;
        sortSel.addEventListener("change", () => { catObj.sort = sortSel.value; saveBoth(); render(); });
        chkLast.addEventListener("change", () => { catObj.checkedLast = chkLast.checked; saveBoth(); render(); });
        toggle.addEventListener("click", () => { const hidden = content.classList.toggle("hidden"); toggle.textContent = hidden ? "Expand" : "Collapse"; });

        let checked = 0;
        const sorted = sortItems(catObj);
        sorted.forEach((it, indexInSorted) => {
          if (it.checked) checked++;
          const matches = !q || it.name.toLowerCase().includes(q);
          const hiddenRow = (hideChecked && it.checked) || !matches;
          if (hiddenRow) return;

          const rowWrap = rowTpl.content.firstElementChild.cloneNode(true);
          const fore = rowWrap.querySelector('.swipe-fore');
          const delBtn = rowWrap.querySelector('button[title=Delete]');
          const label = rowWrap.querySelector('label');
          label.querySelector(".item-name").textContent = it.name;
          const box = label.querySelector("input[type=checkbox]");
          box.checked = !!it.checked;

          box.addEventListener("change", () => { it.checked = box.checked; saveBoth(); render(); });
          delBtn.addEventListener("click", () => removeItem(cat, it, indexInSorted));

          // swipe-to-delete
          let startX=0, curX=0, dragging=false; const THRESH=72;
          fore.addEventListener('touchstart', (e)=>{ startX=e.touches[0].clientX; dragging=true; fore.style.transition='none'; }, {passive:true});
          fore.addEventListener('touchmove',  (e)=>{ if(!dragging)return; curX=e.touches[0].clientX; const dx=Math.min(0, curX-startX); fore.style.transform=`translateX(${dx}px)`; }, {passive:true});
          fore.addEventListener('touchend',   ()=>{ dragging=false; fore.style.transition=''; const dx=Math.min(0, curX-startX); if(Math.abs(dx)>THRESH){ fore.style.transform='translateX(-100%)'; setTimeout(()=>removeItem(cat,it,indexInSorted),120);} else { fore.style.transform=''; } });

          content.appendChild(rowWrap);
        });

        cnt.textContent = `${checked}/${catObj.items.length}`;
        grid.appendChild(card);
      });
    }

    function removeItem(cat, it, indexInSorted){
      const catObj = STATE[cat];
      const originalPos = catObj.items.findIndex(x => x.id === it.id);
      lastDeleted = { cat, item: it, pos: originalPos };
      catObj.items = catObj.items.filter(x => x.id !== it.id);
      saveBoth(); render();
      showToast(`Deleted "${it.name}"`, () => {
        if (!lastDeleted) return;
        const { cat, item, pos } = lastDeleted;
        const arr = STATE[cat].items;
        arr.forEach(a => { if (a.idx >= pos) a.idx++; });
        item.idx = pos;
        arr.splice(pos, 0, item);
        saveBoth(); render();
        lastDeleted = null;
      });
    }

    // Controls
    function quickAdd(){
      const name = document.getElementById('addInput').value.trim();
      const cat = document.getElementById('addCat').value;
      if (!name) return;
      const catObj = STATE[cat];
      const nextIdx = catObj.items.length ? Math.max(...catObj.items.map(i=>i.idx)) + 1 : 0;
      const id = `${cat}-${Date.now()}`;
      catObj.items.push({ id, idx: nextIdx, name, checked:false });
      document.getElementById('addInput').value = '';
      saveBoth(); render();
    }
    document.getElementById('addBtn').addEventListener('click', quickAdd);
    document.getElementById('addInput').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("hideChecked").addEventListener("change", render);

    document.getElementById("selectAll").addEventListener("click", () => {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const hideChecked = document.getElementById("hideChecked").checked;
      Object.values(STATE).forEach(v => {
        if (!v || !v.items) return;
        v.items.forEach(it => {
          const matches = !q || it.name.toLowerCase().includes(q);
          if (matches && !(hideChecked && it.checked)) it.checked = true;
        });
      });
      saveBoth(); render();
    });

    document.getElementById("clearChecked").addEventListener("click", () => {
      Object.values(STATE).forEach(v => { if (v?.items) v.items.forEach(it => it.checked = false); });
      saveBoth(); render();
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
      STATE = seedLocal();
      await docRef.set({ state: STATE, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      saveBoth(); render();
    });

    document.getElementById("btnAisle").addEventListener("click", () => {
      const known = new Set(Object.keys(STATE).filter(k => k !== "_meta"));
      const preset = AISLE_ORDER.filter(c => known.has(c));
      const remainder = [...known].filter(c => !preset.includes(c)).sort();
      STATE._meta.order = [...preset, ...remainder];
      saveBoth(); render();
    });

    document.getElementById("printBtn")?.addEventListener("click", () => window.print());
    document.getElementById("shareBtn")?.addEventListener("click", async () => {
      const url = new URL(location.href);
      const checkedIds = [];
      Object.entries(STATE).forEach(([cat, v]) => {
        if (!v?.items) return;
        v.items.forEach(it => { if (it.checked) checkedIds.push(encodeURIComponent(cat)+"|"+encodeURIComponent(it.name)); });
      });
      url.hash = checkedIds.join(",");
      try { await navigator.clipboard.writeText(url.toString()); alert("Link copied with your selections."); }
      catch { alert("Copy failed—copy the URL manually."); }
    });

    // Share collaborative link (same listId)
    document.getElementById("shareRealtime").addEventListener("click", async () => {
      const url = `${location.origin}${location.pathname}?listId=${encodeURIComponent(listId)}${location.hash}`;
      try { await navigator.clipboard.writeText(url); alert("Live link copied. Send it to your collaborator."); }
      catch { prompt("Copy this live link:", url); }
    });

    // Restore checked from hash (one-time)
    (function restoreFromHash(){
      if (!location.hash) return;
      const parts = location.hash.slice(1).split(",").filter(Boolean);
      const set = new Set(parts);
      Object.entries(STATE).forEach(([cat, v]) => {
        if (!v?.items) return;
        v.items.forEach(it => {
          const key = encodeURIComponent(cat)+"|"+encodeURIComponent(it.name);
          it.checked = set.has(key);
        });
      });
      saveBoth();
    })();

    // PWA: register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    render();
  </script>
</body>
</html>
