<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Shopping List — DnD + Dark Mode</title>
  <script>
    // Tailwind config (enable class-based dark mode)
    tailwind = { config: { darkMode: 'class' } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card:hover { box-shadow: 0 10px 30px rgb(0 0 0 / 0.08); transform: translateY(-1px); }
    .drag-ghost { opacity: .35; }
    @media print {
      .no-print { display:none !important; }
      body { background:#fff; }
      .card { break-inside: avoid; box-shadow:none !important; border:1px solid #e5e7eb; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
  <header class="sticky top-0 z-10 bg-slate-50/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
      <h1 class="text-2xl font-semibold tracking-tight">🛒 Shopping List</h1>
      <div class="flex flex-wrap gap-2 no-print">
        <input id="search" type="search" placeholder="Search items…"
               class="w-64 max-w-[70vw] px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <label class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 cursor-pointer">
          <input id="hideChecked" type="checkbox" class="size-4"> <span class="text-sm">Hide checked</span>
        </label>

        <button id="btnAisle" class="px-3 py-2 rounded-md bg-purple-600 text-white hover:bg-purple-700">Apply Aisle Order</button>
        <button id="selectAll" class="px-3 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700">Select all in view</button>
        <button id="clearChecked" class="px-3 py-2 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600">Clear checked</button>
        <button id="resetBtn" class="px-3 py-2 rounded-md bg-amber-500 text-white hover:bg-amber-600">Reset to defaults</button>
        <button id="printBtn" class="px-3 py-2 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600">Print</button>
        <button id="shareBtn" class="px-3 py-2 rounded-md bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600">Share/Copy link</button>

        <!-- Dark mode toggle -->
        <label class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 cursor-pointer">
          <input id="darkToggle" type="checkbox" class="size-4"> <span class="text-sm">Dark</span>
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <!-- DnD hint -->
    <p class="text-sm text-slate-500 dark:text-slate-400 no-print">Tip: drag a category card by its header to reorder.</p>
    <div id="listRoot" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Card template (per-card sort + checked-last + collapse) -->
  <template id="cardTpl">
    <section class="card bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl transition shadow-sm" draggable="true">
      <div class="px-4 pt-3 flex items-center justify-between handle cursor-grab active:cursor-grabbing">
        <h2 class="font-medium text-lg title select-none"></h2>
        <div class="flex items-center gap-2 no-print">
          <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200 count">0/0</span>
          <select class="sortSel px-2 py-1 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm">
            <option value="original">Original</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
          </select>
          <label class="inline-flex items-center gap-1 px-2 py-1 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm cursor-pointer">
            <input type="checkbox" class="chkLast size-4"> Checked last
          </label>
          <button class="toggle px-2 py-1 rounded-md border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 text-sm">Collapse</button>
        </div>
      </div>
      <hr class="border-slate-200 dark:border-slate-700 mt-2">
      <div class="px-4 py-3 grid gap-2 content"></div>
    </section>
  </template>

  <template id="rowTpl">
    <label class="group flex items-center gap-3 px-2 py-2 rounded-md border border-transparent hover:border-slate-200 dark:hover:border-slate-600 cursor-pointer">
      <input type="checkbox" class="size-4 mt-0.5">
      <span class="flex-1 item-name"></span>
      <button type="button" title="Delete" class="no-print opacity-0 group-hover:opacity-100 transition text-red-600 hover:text-red-700 px-1">🗑️</button>
    </label>
  </template>

  <script>
    // ---------- PRELOADED LIST ----------
    const INITIAL_DATA = {
      "FARMERS MARKET": [
        "any other fruit or veg you see that looks good and is reasonable",
        "only if still looks good Lettuce - 1 large head or 2 small",
        "Apples","Pears","only if still looks good tomatoes- nice mix",
        "corn","zucchini","Cucumber"
      ],
      "Produce": [
        "Bananas","Potatoes yellow or yukon","Lemons (lots)","Apples","Cauliflower",
        "Cherries or pineapple","strawberries","Garlic","Onions","Watermelon",
        "Baby 🥕","Carrots","Grapes","Sweet potatoes"
      ],
      "🧀 Dairy & Eggs": [
        "Soft tortillas","Cream cheese","Mexican cheese","Yogurt flavored","Milk","Parm",
        "Yogurt Greek","Halloumi","Eggs","Queso","Mozz","Cheese sticks","Feta"
      ],
      "🥩 Meat & Alternatives": [
        "Hummus","Chicken nuggets","Tofu (2)","Pepperoni","Meat sticks",
        "Ham for lunchables","Hot dogs"
      ],
      "❄️ Frozen": [
        "Chicken tenders or nuggets","Frozen broccoli","Italian ices lemon","Ice cream",
        "Ice cream cookie dough","Shrimp","mini pancakes","Sweet potato fries",
        "Frozen blueberries","Frozen strawberries","Frozen pizza","Veggie burgers","Edamame"
      ],
      "🥫 Pantry & Dry Goods": [
        "Kosher salt","Coffee","2 Cans cannellini beans","2 cans black beans",
        "Light brown sugar","Spaghetti sauce","Dark brown sugar","Table salt",
        "Mayo","Salsa","Ketchup"
      ],
      "🍝 Grains & Pasta": ["Pizza dough","White rice","Pasta, long, short","Brown rice"],
      "🥣 Cereal": ["Honey Nut Cheerios","Oatmeal","Granola muslei","Cheerios"],
      "🧃 Beverages": ["Lime juice","Seltzer","Apple cider/juice","Lemon juice","2 - 2 liter bottles"],
      "🍬 Snacks & Treats": [
        "Snacks","SunChips","Ice cream","Italian ices (lemon)","Lunch snacks","Popsicles",
        "crackers to make lunchables","Pistachios","Party and chocolate muffins","Walnuts",
        "Marshmallows","Pretzels"
      ],
      "🍞 Bakery": ["Challah","Bread","Pizza dough","Buns","Kids bread","Hot dog buns","Plain bagels for Louisa lunch"]
    };

    // Aisle order preset
    const AISLE_ORDER = [
      "FARMERS MARKET","Produce","🧀 Dairy & Eggs","🥩 Meat & Alternatives",
      "❄️ Frozen","🥫 Pantry & Dry Goods","🍝 Grains & Pasta",
      "🥣 Cereal","🧃 Beverages","🍬 Snacks & Treats","🍞 Bakery"
    ];

    // ---------- STORAGE (versioned; includes theme + order) ----------
    const STORAGE_VER = "v6";
    const STORAGE_KEY = "shopping-list-" + STORAGE_VER;

    function seedState() {
      const s = { _meta: { order: Object.keys(INITIAL_DATA), theme: 'light' } };
      for (const [cat, arr] of Object.entries(INITIAL_DATA)) {
        s[cat] = {
          sort: "original",
          checkedLast: false,
          items: arr.map((name, i) => ({ id:`${cat}-${i}`, idx:i, name, checked:false }))
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return s;
    }
    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seedState(); }
      catch { return seedState(); }
    }
    function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

    let STATE = loadState();

    // ---------- THEME ----------
    function applyTheme(fromState=true){
      const want = fromState ? (STATE._meta?.theme || 'light') :
        (document.body.classList.contains('dark') ? 'dark' : 'light');
      document.body.classList.toggle('dark', want === 'dark');
      if (!fromState) { STATE._meta.theme = want; saveState(STATE); }
      document.getElementById('darkToggle').checked = want === 'dark';
    }
    // Initialize theme immediately
    applyTheme();

    // ---------- HELPERS ----------
    function sortItems(catObj){
      const { sort, checkedLast } = catObj;
      return [...catObj.items].sort((a,b) => {
        if (checkedLast && a.checked !== b.checked) return a.checked ? 1 : -1;
        if (sort === "az") return a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
        if (sort === "za") return b.name.localeCompare(a.name, undefined, {sensitivity:'base'});
        return a.idx - b.idx; // original
      });
    }

    // ---------- RENDER ----------
    const grid  = document.getElementById("listRoot");
    const cardTpl = document.getElementById("cardTpl");
    const rowTpl  = document.getElementById("rowTpl");

    function render(){
      const q = document.getElementById("search").value.trim().toLowerCase();
      const hideChecked = document.getElementById("hideChecked").checked;

      grid.innerHTML = "";

      const order = STATE._meta?.order ?? Object.keys(INITIAL_DATA);
      order.forEach(cat => {
        const catObj = STATE[cat];
        if (!catObj) return;

        const card = cardTpl.content.firstElementChild.cloneNode(true);
        card.dataset.cat = cat;
        card.querySelector(".title").textContent = cat;

        const content = card.querySelector(".content");
        const cnt = card.querySelector(".count");
        const sortSel = card.querySelector(".sortSel");
        const chkLast = card.querySelector(".chkLast");
        const toggle  = card.querySelector(".toggle");

        sortSel.value = catObj.sort || "original";
        chkLast.checked = !!catObj.checkedLast;

        sortSel.addEventListener("change", () => { catObj.sort = sortSel.value; saveState(STATE); render(); });
        chkLast.addEventListener("change", () => { catObj.checkedLast = chkLast.checked; saveState(STATE); render(); });
        toggle.addEventListener("click", () => {
          const hidden = content.classList.toggle("hidden");
          toggle.textContent = hidden ? "Expand" : "Collapse";
        });

        let checked = 0, visible = 0;
        const sorted = sortItems(catObj);
        sorted.forEach(it => {
          if (it.checked) checked++;
          const matches = !q || it.name.toLowerCase().includes(q);
          const hiddenRow = (hideChecked && it.checked) || !matches;
          if (hiddenRow) return;

          const row = rowTpl.content.firstElementChild.cloneNode(true);
          row.querySelector(".item-name").textContent = it.name;
          const box = row.querySelector("input[type=checkbox]");
          box.checked = !!it.checked;
          box.addEventListener("change", () => { it.checked = box.checked; saveState(STATE); render(); });
          row.querySelector("button[title=Delete]").addEventListener("click", () => {
            catObj.items = catObj.items.filter(x => x.id !== it.id);
            saveState(STATE); render();
          });
          content.appendChild(row);
          visible++;
        });

        cnt.textContent = `${checked}/${catObj.items.length}`;
        if (visible === 0) { content.classList.add("hidden"); toggle.textContent = "Expand"; }

        // ---- DnD for category cards ----
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', cat);
          card.classList.add('drag-ghost');
        });
        card.addEventListener('dragend', () => card.classList.remove('drag-ghost'));
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          const draggedCat = e.dataTransfer.getData('text/plain');
          if (!draggedCat || draggedCat === cat) return;
          const arr = STATE._meta.order.slice();
          const from = arr.indexOf(draggedCat);
          const to = arr.indexOf(cat);
          if (from === -1 || to === -1) return;
          arr.splice(to, 0, arr.splice(from,1)[0]);
          STATE._meta.order = arr;
          saveState(STATE);
          render();
        });

        grid.appendChild(card);
      });
    }

    // ---------- CONTROLS ----------
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("hideChecked").addEventListener("change", render);

    document.getElementById("selectAll").addEventListener("click", () => {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const hideChecked = document.getElementById("hideChecked").checked;
      Object.values(STATE).forEach(v => {
        if (!v || !v.items) return;
        v.items.forEach(it => {
          const matches = !q || it.name.toLowerCase().includes(q);
          if (matches && !(hideChecked && it.checked)) it.checked = true;
        });
      });
      saveState(STATE); render();
    });

    document.getElementById("clearChecked").addEventListener("click", () => {
      Object.values(STATE).forEach(v => { if (v?.items) v.items.forEach(it => it.checked = false); });
      saveState(STATE); render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      STATE = seedState();
      applyTheme(); // reset theme to light
      render();
    });

    document.getElementById("printBtn").addEventListener("click", () => window.print());

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const url = new URL(location.href);
      const checkedIds = [];
      Object.entries(STATE).forEach(([cat, v]) => {
        if (!v?.items) return;
        v.items.forEach(it => { if (it.checked) checkedIds.push(encodeURIComponent(cat)+"|"+encodeURIComponent(it.name)); });
      });
      url.hash = checkedIds.join(",");
      try { await navigator.clipboard.writeText(url.toString()); alert("Link copied with your selections."); }
      catch { alert("Copy failed—copy the URL manually."); }
    });

    document.getElementById("btnAisle").addEventListener("click", () => {
      const known = new Set(Object.keys(STATE).filter(k => k !== "_meta"));
      const preset = AISLE_ORDER.filter(c => known.has(c));
      const remainder = [...known].filter(c => !preset.includes(c)).sort();
      STATE._meta.order = [...preset, ...remainder];
      saveState(STATE); render();
    });

    // Dark mode toggle
    document.getElementById('darkToggle').addEventListener('change', (e) => {
      document.body.classList.toggle('dark', e.target.checked);
      STATE._meta.theme = e.target.checked ? 'dark' : 'light';
      saveState(STATE);
    });

    // Restore checked from shared link
    (function restoreFromHash(){
      if (!location.hash) return;
      const parts = location.hash.slice(1).split(",").filter(Boolean);
      const set = new Set(parts);
      Object.entries(STATE).forEach(([cat, v]) => {
        if (!v?.items) return;
        v.items.forEach(it => {
          const key = encodeURIComponent(cat)+"|"+encodeURIComponent(it.name);
          it.checked = set.has(key);
        });
      });
      saveState(STATE);
    })();

    render();
  </script>
</body>
</html>
