<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping List App</title>

  <!-- libs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script>
    const { useState } = React;
    const { Trash2, Plus, GripVertical } = lucide;

    const ShoppingApp = () => {
      const [items, setItems] = useState([
        { id: 1, name: 'Milk',     category: 'Dairy',   selected: false },
        { id: 2, name: 'Bread',    category: 'Bakery',  selected: false },
        { id: 3, name: 'Apples',   category: 'Produce', selected: true  },
        { id: 4, name: 'Chicken',  category: 'Meat',    selected: false },
        { id: 5, name: 'Yogurt',   category: 'Dairy',   selected: false },
        { id: 6, name: 'Bananas',  category: 'Produce', selected: false },
      ]);

      const [newItem, setNewItem] = useState('');
      const [newCategory, setNewCategory] = useState('Produce');
      const [draggedItem, setDraggedItem] = useState(null);

      const categories = ['Produce','Dairy','Meat','Bakery','Pantry','Frozen','Other'];

      const addItem = () => {
        if (!newItem.trim()) return;
        setItems(prev => [...prev, {
          id: Date.now(), name: newItem.trim(), category: newCategory, selected: false
        }]);
        setNewItem('');
      };

      const deleteItem = id => setItems(items.filter(i => i.id !== id));
      const toggleSelected = id => setItems(items.map(i => i.id===id ? {...i, selected:!i.selected} : i));

      const handleDragStart = (e, item) => { setDraggedItem(item); e.dataTransfer.effectAllowed='move'; };
      const handleDragOver  = e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; };
      const handleDrop = (e, targetCategory) => {
        e.preventDefault();
        if (draggedItem && draggedItem.category !== targetCategory) {
          setItems(items.map(i => i.id===draggedItem.id ? {...i, category:targetCategory} : i));
        }
        setDraggedItem(null);
      };

      const grouped = categories.reduce((acc, c) => (acc[c]=items.filter(i=>i.category===c), acc), {});

      return React.createElement('div', { className: "max-w-4xl mx-auto p-6 min-h-screen" }, [
        React.createElement('h1', { key:'t', className:"text-2xl font-bold text-gray-800 mb-6" }, 'Shopping List'),

        React.createElement('div', { key:'form', className:"bg-white rounded-lg shadow-sm p-4 mb-6" },
          React.createElement('div', { className:"flex gap-3" }, [
            React.createElement('input', {
              key:'i', type:'text', value:newItem, placeholder:'Add new item...',
              onChange:e=>setNewItem(e.target.value),
              onKeyDown:e=>e.key==='Enter' && addItem(),
              className:"flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            }),
            React.createElement('select', {
              key:'s', value:newCategory, onChange:e=>setNewCategory(e.target.value),
              className:"px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            }, categories.map(c => React.createElement('option', { key:c, value:c }, c))),
            React.createElement('button', {
              key:'b', onClick:addItem,
              className:"px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            }, React.createElement(Plus, { size:20 }))
          ])
        ),

        React.createElement('div', { key:'lists', className:"grid gap-4 md:grid-cols-2 lg:grid-cols-3" },
          categories.map(cat => {
            const list = grouped[cat];
            if (!list || list.length===0) return null;
            return React.createElement('div', {
              key:cat, className:"bg-white rounded-lg shadow-sm p-4",
              onDragOver:handleDragOver, onDrop:e=>handleDrop(e, cat)
            }, [
              React.createElement('h2', { key:'h', className:"text-lg font-semibold text-gray-700 mb-3 border-b pb-2" }, `${cat} (${list.length})`),
              React.createElement('div', { key:'items', className:"space-y-2" },
                list.map(item => React.createElement('div', {
                  key:item.id, draggable:true, onDragStart:e=>handleDragStart(e,item),
                  className:`flex items-center gap-3 p-2 rounded-md cursor-move transition-colors ${
                    item.selected ? 'bg-green-100 text-green-800' : 'bg-gray-50 hover:bg-gray-100'
                  } ${draggedItem && draggedItem.id===item.id ? 'opacity-50' : ''}`
                }, [
                  React.createElement(GripVertical, { key:'g', size:16, className:"text-gray-400" }),
                  React.createElement('input', { key:'c', type:'checkbox', checked:item.selected, onChange:()=>toggleSelected(item.id), className:"rounded focus:ring-2 focus:ring-blue-500" }),
                  React.createElement('span', { key:'n', className:`flex-1 ${item.selected ? 'line-through' : ''}` }, item.name),
                  React.createElement('button', { key:'x', onClick:()=>deleteItem(item.id), className:"text-red-500 hover:text-red-700 p-1" },
                    React.createElement(Trash2, { size:16 })
                  )
                ]))
              )
            ]);
          })
        ),

        React.createElement('div', { key:'sum', className:"mt-6 bg-white rounded-lg shadow-sm p-4" },
          React.createElement('div', { className:"flex justify-between text-sm text-gray-600" }, [
            React.createElement('span', { key:'t' }, `Total items: ${items.length}`),
            React.createElement('span', { key:'s' }, `Selected: ${items.filter(i=>i.selected).length}`),
            React.createElement('span', { key:'r' }, `Remaining: ${items.filter(i=>!i.selected).length}`)
          ])
        )
      ]);
    };

    ReactDOM.render(React.createElement(ShoppingApp), document.getElementById('root'));
  </script>
</body>
</html>
